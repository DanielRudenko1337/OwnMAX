name: OwnMAX checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . black build ruff
      - run: python tests/run.py
      - run: black --check src tests services/sms/app examples tools
      - run: ruff check --select F821,F822,F823,F811 src services/sms/app examples tests
      - run: python -m build
      - run: docker build -t ownmax-check .
