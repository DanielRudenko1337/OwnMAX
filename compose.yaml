services:
  ownmax:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      db_type: sqlite
      OWNMAX_DATA_DIR: /app/data
      certfile: /app/certs/cert.pem
      keyfile: /app/certs/key.pem
      OWNMAX_HTTP_HOST: 0.0.0.0
    ports:
      - "8443:8443"
      - "8444:8444"
      - "8081:8081"
      - "8082:8082"
      - "127.0.0.1:9183:9183"
    volumes:
      - ownmax_data:/app/data
      - ./certs:/app/certs:ro
volumes:
  ownmax_data:
